<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="130" viewBox="0 0 1200 130"
     role="img" aria-labelledby="title desc">
  <title id="title">TypstKit</title>
  <desc id="desc">Section header: TypstKit — the Typst compiler, in Swift. Two of five port stages are filled in.</desc>

  <rect width="1200" height="130" rx="22" fill="#FBFAF5"/>
  <line x1="48" y1="100" x2="1152" y2="100" stroke="#D8D4C4" stroke-width="1.5"/>

  <text x="56" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="2" fill="#8A8778">PRODUCT 01 · COMPILER PORT</text>
  <text x="56" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="36" font-weight="600"><tspan fill="#239DAD">#</tspan><tspan dx="8" fill="#1B1A15">TypstKit</tspan></text>
  <text x="281" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif"
        font-size="21" fill="#6B685C">— the Typst compiler, in Swift</text>

  <!-- port status: parse → export -->
  <g id="cue">
    <text x="1030" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" letter-spacing="2" fill="#8A8778">PORT STATUS</text>
    <line x1="950" y1="70" x2="1110" y2="70" stroke="#D8D4C4" stroke-width="2"/>
    <circle cx="950" cy="70" r="7" fill="#239DAD"/>
    <circle cx="990" cy="70" r="7" fill="#239DAD"/>
    <circle cx="1030" cy="70" r="7" fill="none" stroke="#B9B4A3" stroke-width="2"/>
    <circle cx="1070" cy="70" r="7" fill="none" stroke="#B9B4A3" stroke-width="2"/>
    <circle cx="1110" cy="70" r="7" fill="none" stroke="#B9B4A3" stroke-width="2"/>
    <text x="1030" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#8A8778">parse → export</text>
  </g>
</svg>
