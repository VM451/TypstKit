<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">TypstKit — the Typst ecosystem, native in Swift</title>
  <desc id="desc">TypstKit wordmark beside a page showing Typst markup compiling into a typeset document: a serif heading, text lines, an equation, and a small table.</desc>

  <!-- manuscript page background with faint baseline grid -->
  <rect width="1200" height="400" rx="26" fill="#FBFAF5"/>
  <g stroke="#EFEBDE" stroke-width="1">
    <line x1="40" y1="60" x2="1160" y2="60"/>
    <line x1="40" y1="100" x2="1160" y2="100"/>
    <line x1="40" y1="140" x2="1160" y2="140"/>
    <line x1="40" y1="180" x2="1160" y2="180"/>
    <line x1="40" y1="220" x2="1160" y2="220"/>
    <line x1="40" y1="260" x2="1160" y2="260"/>
    <line x1="40" y1="300" x2="1160" y2="300"/>
    <line x1="40" y1="340" x2="1160" y2="340"/>
    <line x1="40" y1="380" x2="1160" y2="380"/>
  </g>

  <!-- title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="3" fill="#77746A">SWIFT PACKAGE · APPLE PLATFORMS</text>
    <text x="64" y="170" font-size="74" font-weight="700" fill="#1B1A15"><tspan
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-weight="600" fill="#239DAD">#</tspan><tspan dx="10">TypstKit</tspan></text>
    <!-- the title sits on a baseline, with crop ticks -->
    <line x1="64" y1="192" x2="656" y2="192" stroke="#D8D4C4" stroke-width="1.5"/>
    <line x1="64" y1="186" x2="64" y2="198" stroke="#B9B4A3" stroke-width="1.5"/>
    <line x1="656" y1="186" x2="656" y2="198" stroke="#B9B4A3" stroke-width="1.5"/>

    <text x="64" y="238" font-size="23" fill="#44423A">Convert any document to .typ, browse the Typst</text>
    <text x="64" y="268" font-size="23" fill="#44423A">Universe, and compile markup — pure Swift.</text>

    <!-- metadata chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5C594E">
      <rect x="64" y="300" width="128" height="40" rx="20" fill="#FFFFFF" stroke="#E0DCCE" stroke-width="1.5"/>
      <text x="128" y="326" text-anchor="middle">SWIFT 6.4</text>
      <rect x="208" y="300" width="232" height="40" rx="20" fill="#FFFFFF" stroke="#E0DCCE" stroke-width="1.5"/>
      <text x="324" y="326" text-anchor="middle">ZERO RUNTIME DEPS</text>
      <rect x="456" y="300" width="212" height="40" rx="20" fill="#FFFFFF" stroke="#E0DCCE" stroke-width="1.5"/>
      <text x="562" y="326" text-anchor="middle">APACHE-2.0 / MIT</text>
    </g>
  </g>

  <!-- proof: a page with crop marks — markup in, type out -->
  <g id="project-proof">
    <!-- crop marks -->
    <g stroke="#B9B4A3" stroke-width="2" fill="none">
      <line x1="694" y1="40" x2="712" y2="40"/><line x1="720" y1="22" x2="720" y2="38"/>
      <line x1="1144" y1="40" x2="1162" y2="40"/><line x1="1136" y1="22" x2="1136" y2="38"/>
      <line x1="694" y1="360" x2="712" y2="360"/><line x1="720" y1="362" x2="720" y2="378"/>
      <line x1="1144" y1="360" x2="1162" y2="360"/><line x1="1136" y1="362" x2="1136" y2="378"/>
    </g>
    <rect x="720" y="40" width="416" height="320" rx="10" fill="#FFFFFF" stroke="#E0DCCE" stroke-width="1.5"/>

    <!-- markup pane -->
    <rect x="744" y="64" width="368" height="150" rx="10" fill="#F4F2E9"/>
    <text x="760" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#8A8778">main.typ</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <text x="760" y="118"><tspan fill="#17808E">#set</tspan><tspan fill="#454338"> page(paper: </tspan><tspan fill="#B07A2E">"a6"</tspan><tspan fill="#454338">)</tspan></text>
      <text x="760" y="145"><tspan fill="#17808E">=</tspan><tspan fill="#454338"> Quarterly Report</tspan></text>
      <text x="760" y="172"><tspan fill="#17808E">$</tspan><tspan fill="#454338"> E = m c^2 </tspan><tspan fill="#17808E">$</tspan></text>
      <text x="760" y="199"><tspan fill="#17808E">#table</tspan><tspan fill="#454338">(columns: 2)[…]</tspan></text>
    </g>

    <!-- compile arrow -->
    <g stroke="#239DAD" stroke-width="2.5" fill="none">
      <line x1="928" y1="224" x2="928" y2="248"/>
      <path d="M 921 242 L 928 250 L 935 242"/>
    </g>
    <text x="948" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#8A8778">compile</text>

    <!-- rendered output -->
    <text x="760" y="282" font-family="'New York', Georgia, 'Times New Roman', serif"
          font-size="25" font-weight="700" fill="#1B1A15">Quarterly Report</text>
    <line x1="760" y1="290" x2="1112" y2="290" stroke="#D8D4C4" stroke-width="1"/>
    <rect x="760" y="300" width="196" height="9" rx="4.5" fill="#CFCABB"/>
    <rect x="760" y="316" width="150" height="9" rx="4.5" fill="#CFCABB"/>
    <text x="760" y="342" font-family="'New York', Georgia, 'Times New Roman', serif"
          font-size="21" font-style="italic" fill="#3A3830">E = mc²</text>

    <!-- mini table -->
    <g>
      <rect x="988" y="298" width="124" height="50" fill="#FFFFFF" stroke="#B9B4A3" stroke-width="1.5"/>
      <rect x="988" y="298" width="124" height="18" fill="#E0F1F3"/>
      <line x1="988" y1="316" x2="1112" y2="316" stroke="#B9B4A3" stroke-width="1"/>
      <line x1="988" y1="332" x2="1112" y2="332" stroke="#B9B4A3" stroke-width="1"/>
      <line x1="1050" y1="298" x2="1050" y2="348" stroke="#B9B4A3" stroke-width="1"/>
    </g>
  </g>
</svg>
